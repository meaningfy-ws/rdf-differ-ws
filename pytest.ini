[pytest]
# No-src layout: make the top-level package importable from the repo root.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_functions = test_*

# pytest-bdd: where the .feature files live.
bdd_features_base_dir = tests/features

addopts =
    -v
    --strict-markers
    --tb=short

# Silence pyparsing deprecation noise emitted from inside rdflib's SPARQL parser
# (third-party — not our code; nothing to fix on our side until rdflib upgrades).
filterwarnings =
    ignore::DeprecationWarning:pyparsing.*
    ignore:.*deprecated.*:DeprecationWarning:rdflib.*

# Markers are applied automatically by tests/conftest.py via
# pytest_collection_modifyitems (by path) — do NOT add per-file pytestmark.
markers =
    unit: fast, no I/O — domain/service/adapter layer tests
    feature: BDD feature tests (pytest-bdd step definitions)
    e2e: end-to-end tests against a near-real stack
    integration: requires a running datastore/service (Fuseki, Redis, the API)

# No --cov here (decision D5): coverage flags live only in the Makefile's
# `test` / `coverage-report` targets so a bare `pytest` stays fast.
