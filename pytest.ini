[pytest]
# No-src layout: make the top-level package importable from the repo root.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_functions = test_*

# pytest-bdd: where the .feature files live.
bdd_features_base_dir = tests/features

# No --cov here (decision D5): coverage flags live only in the Makefile's
# `test` / `coverage-report` targets so a bare `pytest` stays fast.
#
# NOTE (modernization): the full canonical pytest.ini — strict markers and the
# unit/feature/e2e/integration marker set applied by tests/conftest.py — lands in
# slice 6 (test-tree reorg), together with pytest-bdd 8. Kept minimal here so the
# existing suite runs unchanged on the new stack.
