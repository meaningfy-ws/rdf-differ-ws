
services:
  rdf-differ-api:
    container_name: rdf-differ-api-${ENVIRONMENT}
    build:
      context: ..
      dockerfile: ./infra/api/Dockerfile
    volumes:
      - ..:/usr/src/app
      - rdf-differ-template:${RDF_DIFFER_TEMPLATE_LOCATION}
    ports:
      - ${RDF_DIFFER_API_PORT}:${RDF_DIFFER_API_PORT}
    env_file: .env
    networks:
      - mydefault
    depends_on:
      rdf-differ-redis:
        condition: service_healthy
      rdf-differ-fuseki:
        condition: service_healthy
    # `docker compose up --wait` blocks until this is healthy — replaces the manual `sleep`.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${RDF_DIFFER_API_PORT}/diffs"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  rdf-differ-ui:
    container_name: rdf-differ-ui-${ENVIRONMENT}
    build:
      context: ..
      dockerfile: ./infra/ui/Dockerfile
    volumes:
      - ..:/usr/src/app
    ports:
      - ${RDF_DIFFER_UI_PORT}:${RDF_DIFFER_UI_PORT}
    env_file: .env
    networks:
      - mydefault

  rdf-differ-fuseki:
    container_name: rdf-differ-fuseki-${ENVIRONMENT}
    image: stain/jena-fuseki:4.0.0
    volumes:
      - ${PWD}/${RDF_DIFFER_FUSEKI_DATA_FOLDER}/fuseki:/fuseki
    env_file: .env
    environment:
      - ADMIN_PASSWORD=${RDF_DIFFER_FUSEKI_ADMIN_PASSWORD}
      - JVM_ARGS=${RDF_DIFFER_FUSEKI_JVM_ARGS}
    ports:
      - ${RDF_DIFFER_FUSEKI_PORT}:${RDF_DIFFER_FUSEKI_PORT}
    networks:
      - mydefault
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${RDF_DIFFER_FUSEKI_PORT}/$$/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  rdf-differ-celery-worker:
    container_name: rdf-differ-celery-worker-${ENVIRONMENT}
    build:
      context: ..
      dockerfile: ./infra/api/Dockerfile
    # Log to stdout (docker-native) — a --logfile under a non-existent logs/ dir crashes boot.
    command: celery -A rdf_differ.api.services.celery.celery_worker worker --loglevel info
    volumes:
      - ..:/usr/src/app
    env_file: .env
    networks:
      - mydefault
    depends_on:
      rdf-differ-redis:
        condition: service_healthy
      rdf-differ-fuseki:
        condition: service_healthy

  rdf-differ-redis:
    image: redis:6-alpine
    container_name: rdf-differ-redis-${ENVIRONMENT}
    ports:
      - ${RDF_DIFFER_REDIS_PORT}:${RDF_DIFFER_REDIS_PORT}
    networks:
      - mydefault
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rdf-differ-flower:
    container_name: rdf-differ-flower-${ENVIRONMENT}
    build:
      context: ..
      dockerfile: ./infra/api/Dockerfile
    command: celery -A rdf_differ.api.services.celery.celery_worker --broker=${RDF_DIFFER_REDIS_LOCATION}:${RDF_DIFFER_REDIS_PORT} flower --port=${RDF_FLOWER_PORT}
    ports:
      - ${RDF_FLOWER_PORT}:${RDF_FLOWER_PORT}
    depends_on:
      - rdf-differ-api
      - rdf-differ-celery-worker
      - rdf-differ-redis
    networks:
      - mydefault

volumes:
  # Auto-created by compose (was external:true, which forced a manual `docker volume create`).
  rdf-differ-template:


networks:
  mydefault:
    name: globalnet