<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RDF Differ{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='main.css') }}">
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a class="brand" href="{{ url_for('index') }}">
            <span class="brand-mark">RDF</span> Differ
        </a>
        <nav class="nav">
            <a class="nav-link {% if active_page == 'index' %}is-active{% endif %}"
               href="{{ url_for('index') }}">Diffs</a>
            <a class="nav-link {% if active_page == 'view_active_tasks' %}is-active{% endif %}"
               href="{{ url_for('get_active_tasks') }}">Tasks</a>
            <a class="nav-link nav-cta {% if active_page == 'create_diff' %}is-active{% endif %}"
               href="{{ url_for('create_diff') }}">Create diff</a>
        </nav>
    </div>
</header>

<main class="container main">
    {% if flashes %}
        <div class="flashes">
            {% for flash in flashes %}
                <div class="flash flash-{{ flash.category }}">{{ flash.message }}</div>
            {% endfor %}
        </div>
    {% endif %}
    {% block content %}{% endblock %}
</main>

<footer class="site-footer">
    <div class="container">
        Powered by <a href="https://github.com/meaningfy-ws">Meaningfy</a>
    </div>
</footer>
</body>
</html>
