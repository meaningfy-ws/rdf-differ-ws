name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Least-privilege GITHUB_TOKEN (read-only; nothing here writes to the repo).
permissions:
  contents: read

jobs:
  quality-and-tests:
    name: quality + tests
    runs-on: ubuntu-22.04
    services:
      redis:
        image: redis:6-alpine
        ports: ['6379:6379']
      fuseki:
        image: stain/jena-fuseki:4.0.0
        env:
          ADMIN_PASSWORD: admin
        ports: ['3030:3030']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --with dev,test,lint

      - name: Quality gate (Ruff + import-linter)
        run: make check-quality

      - name: Validate the spec spine
        run: npx -y @fission-ai/openspec@1.4.1 validate --changes --strict

      - name: Unit tests with coverage
        # Exclude @integration tests: they need a live API / the legacy skos-history pipeline,
        # which this job (Redis + Fuseki only) does not provide.
        run: poetry run pytest tests/unit -m "not integration" --cov=rdf_differ --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unit
          fail_ci_if_error: false
