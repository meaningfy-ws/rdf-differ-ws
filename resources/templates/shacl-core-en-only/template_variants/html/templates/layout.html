<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>{{ conf.title }}</title>

    <meta name="description" content="">
    <meta name=viewport content="width=device-width, initial-scale=1">
    <meta name="mobile-web-app-capable" content="yes">


    <link rel="stylesheet" type="text/css"
          href="https://cdnjs.cloudflare.com/ajax/libs/fomantic-ui/2.8.7/semantic.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/jquery.tocify/1.9.0/stylesheets/jquery.tocify.min.css"
          rel="stylesheet"
          type="text/css">
    <link href="https://code.jquery.com/ui/1.11.4/themes/redmond/jquery-ui.css" rel="stylesheet" type="text/css">
    <link href="https://cdn.datatables.net/1.10.22/css/jquery.dataTables.min.css" rel="stylesheet" type="text/css">


    <style>
        .buttons-print {
            margin-bottom: 0.5em !important;
        }

        #toc {
            width: 15%;
            margin-top: 2.5em;
            padding: 0.5em;
        }

        .reportTitle {
            margin-top: 1em !important;
        }

        footer {
            background: #bdbdbd;
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 50px;
            margin: 0;
        }

        .footerText {
            margin: revert !important;
        }

        #printButton{
            float: right;
            margin-top: 0.5em;
        }

        /* Enable horizontal scrolling for wide tables */
        #print-container {
            overflow-x: auto;
        }

        .dataTables_wrapper {
            overflow-x: auto;
        }

        table.display {
            width: auto;
            min-width: 100%;
        }

        @media print {
            #toc {
                visibility: hidden;
            }

            #print-container,
            .dataTables_wrapper,
            .dataTables_scrollHead,
            .dataTables_scrollBody {
                overflow: visible !important;
                width: auto !important;
            }
            table.display {
                width: auto !important;
            }

            footer {
                display: none;
            }
            #printButton {
                visibility: hidden;
            }
            .dataTables_length, .dataTables_filter, .dt-buttons {
                visibility: hidden !important;
            }
            @page {size: landscape !important}
        }

    </style>
</head>

<body>
<main class="ui grid">
    <div class="three wide column">
        <div id="toc"></div>
    </div>

    <div id="print-container" class="ten wide column">
        <button class="ui button" id="printButton">Print report</button>
        <h1 class="ui header center aligned reportTitle" id="skip-toc">{{ conf.title }}</h1>
        {% block content %}
            < empty >
        {% endblock %}
    </div>
</main>
<footer>
    <div class="ui container center aligned">
        <p class="footerText">Powered by
            <a href="https://github.com/meaningfy-ws">Meaningfy</a></p>
    </div>
</footer>


</body>
</html>
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script type="text/javascript" src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fomantic-ui/2.8.7/semantic.min.js"></script>
<script type="text/javascript" src="https://cdn.datatables.net/1.10.22/js/jquery.dataTables.min.js"></script>
<script type="text/javascript" src="https://cdn.datatables.net/buttons/1.6.4/js/dataTables.buttons.min.js"></script>
<script type="text/javascript" src="https://cdn.datatables.net/buttons/1.6.4/js/buttons.print.min.js"></script>
<script type="text/javascript"
        src="https://cdnjs.cloudflare.com/ajax/libs/jquery.tocify/1.9.0/javascripts/jquery.tocify.min.js"></script>

<script type="text/javascript">
    $(document).ready(function () {
        const tables = [];

        $("table.display").each(function () {
            const columns = $(this).find("th").map(function () {
                return { orderable: true };
            }).get();

            const instance = $(this).DataTable({
                dom: 'B<"clear">lfrtip',
                buttons: ['print'],
                lengthMenu: [[5, 15, 30, -1], [5, 15, 30, "All"]],
                scrollX: true,
                autoWidth: false,
                columns: columns
            });

            tables.push(instance);
        });

        // Fix column alignment on window resize
        if (tables.length) {
            $(window).on('resize', function () {
                tables.forEach(dt => dt.columns.adjust());
            });
        }

        $("h2").each(function () {
            if (!$(this).next().is("section") && !$(this).next().is("h3") && !$(this).next().hasClass("dataTables_wrapper")) {
                $(this).remove();
            }
        });
        $("h1").not(':first').each(function () {
            if (!$(this).next().is("h2") && !$(this).next().is("section")) {
                $(this).remove();
            }
        });

        let number_of_headings_one = $('h1').toArray()

        if (number_of_headings_one.length === 3) {
            $("h1").not(':first').each(function () {
                $(this).next().remove()
                $(this).remove();
            });
            $("#print-container").append("<p><strong>Datasets are identical and no difference was found</strong></p>")
        }

        $("#toc").tocify({
            selectors: "h1,h2",
            theme: "jqueryui",
            hashGenerator: "pretty",
            ignoreSelector: "#skip-toc",
            highlightOnScroll: "true",
            highlightDefault: "true"
        });

        $("#printButton").click(function () {
            // First, expand all tables to show all rows
            tables.forEach(dt => dt.page.len(-1).draw());

            // Force a reflow so print styles can apply
            // Then recalculate column widths for print layout
            setTimeout(function() {
                tables.forEach(dt => dt.columns.adjust());
                // Small delay to ensure adjustments complete before print dialog
                setTimeout(function() {
                    window.print();
                }, 50);
            }, 100);
        });


    });

</script>
